{"name": "Actualizar panel diariamente", "on": {"schedule": [{"cron": "50 9 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"actualizar": {"runs-on": "ubuntu-latest", "steps": [{"name": "Checkout", "uses": "actions/checkout@v4"}, {"name": "Setup Python", "uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "Instalar dependencias", "run": "pip install -r requirements.txt"}, {"name": "Bajar datos de Chess ERP", "env": {"CHESS_BASE_URL": "${{ vars.CHESS_BASE_URL }}", "CHESS_USER": "${{ secrets.CHESS_USER }}", "CHESS_PASSWORD": "${{ secrets.CHESS_PASSWORD }}"}, "run": "python scripts/fetch_data.py"}, {"name": "Preparar datos", "run": "python scripts/prepare_multi.py"}, {"name": "Generar index.html", "run": "python scripts/build_html.py"}, {"name": "Commit y push si cambio algo", "run": "git config user.name \"github-actions[bot]\" && git config user.email \"github-actions[bot]@users.noreply.github.com\" && git add index.html && (git diff --cached --quiet && echo \"Sin cambios\" || (git commit -m \"Actualizacion automatica de datos\" && git push))"}]}}}
